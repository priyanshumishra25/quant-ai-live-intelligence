name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm install --global typescript@5.8.3
      - name: Verify release
        run: make verify
      - name: Ensure committed frontend build is current
        run: |
          make frontend-build
          git diff --exit-code -- frontend/dist
      - name: Secret-pattern sanity check
        shell: bash
        run: |
          test ! -f .env
          test ! -f deployment/.env
          ! git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})' -- . ':!*.md'
      - name: Validate Compose
        run: docker compose -f deployment/docker-compose.yml config >/dev/null
      - name: Build runnable containers
        run: |
          docker build -f deployment/Dockerfile --target api -t quant-ai-api:ci .
          docker build -f frontend/Dockerfile -t quant-ai-frontend:ci .
